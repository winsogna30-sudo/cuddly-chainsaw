<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lexicon">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b1220">
<title>Lexicon Master Suite</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111a2e;--panel2:#18233c;--line:#25324f;--tx:#e6ebf5;--mut:#8b9ab8;--ac:#6366f1;--ac2:#a5b4fc;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:18px}
h1{font-size:1.35rem;margin:0;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0 0 12px}
#stats{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;color:var(--mut);font-size:.88rem}
#stats b{color:var(--tx);font-weight:650}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:.9rem;color:var(--mut);margin-bottom:14px}
input,textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.mut{color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;color:#fff;background:var(--ac);border:0;border-radius:10px;padding:12px 18px;min-height:46px;cursor:pointer}
.btn.ghost{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.88rem}
.btn.bad{background:var(--bad);color:#2a0a0a}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{font:inherit;font-size:.84rem;color:var(--ac2);background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;min-height:34px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.item h3{margin:0 0 4px;font-size:1.05rem}
.item p{margin:0 0 6px}
.trig{color:var(--mut);font-style:italic;font-size:.92rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.tag{font-size:.78rem;color:var(--ac2);background:var(--panel2);border-radius:99px;padding:2px 10px}
.sp{flex:1}
.card{perspective:1100px;margin:6px 0 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.inner{position:relative;min-height:300px;transition:transform .45s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:auto;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{transform:rotateY(180deg);background:var(--panel2);border-color:var(--ac)}
.big{font-size:2.1rem;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.scn{font-size:1.2rem;line-height:1.45}
.hint{margin-top:18px;color:var(--mut);font-size:.85rem}
.grades{display:none;grid-template-columns:repeat(5,1fr);gap:8px}
.grades.on{display:grid}
.g{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 2px;min-height:62px;cursor:pointer}
.g b{display:block;font-size:1.25rem}
.g span{font-size:.72rem;color:var(--mut)}
.g:active{background:var(--ac)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-bottom:1px solid var(--line)}
nav button{font:inherit;font-size:.9rem;color:var(--mut);background:none;border:0;padding:12px 4px;min-height:56px;cursor:pointer}
nav button.on{color:var(--ac2);box-shadow:inset 0 -2px 0 var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#052e1d;padding:9px 16px;border-radius:99px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.note{background:#3b2a05;color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.88rem}
details{margin-top:22px}
summary{cursor:pointer;color:var(--mut);padding:8px 0}
.empty{text-align:center;padding:36px 12px}
.qc{text-align:center;padding:26px 18px;margin-bottom:14px}
.opts{display:grid;gap:10px;margin-bottom:14px}
.opt{font:inherit;text-align:left;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:54px;cursor:pointer}
.opt:disabled{color:var(--tx);opacity:1;cursor:default}
.opt b{color:var(--ac2);margin-right:8px}
.opt.ok{border-color:var(--ok);background:#0f2a22}
.opt.bad{border-color:var(--bad);background:#2a1216}
.fb{margin-top:14px}.fb p{margin:8px 0}
.okp{border-color:var(--ok)}.badp{border-color:var(--bad)}
.gh{margin:22px 0 10px;text-transform:capitalize}
.pk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);color:var(--tx);font-size:1rem;margin:0}
.pk input{width:22px;height:22px;margin:2px 0 0;flex:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:6}
@media (min-width:900px){nav{position:fixed;left:0;top:0;bottom:0;width:190px;grid-template-columns:1fr;grid-auto-rows:52px;align-content:start;padding-top:24px;border-bottom:0;border-right:1px solid var(--line)}nav button{text-align:left;padding-left:22px}nav button.on{box-shadow:inset 3px 0 0 var(--ac)}body{padding-left:190px}}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>
<body>
<nav>
  <button data-act="tab" data-v="study">◉ Study</button>
  <button data-act="tab" data-v="log">✎ Log</button>
  <button data-act="tab" data-v="vault">☰ Vault</button>
  <button data-act="tab" data-v="disc">✦ Discover</button>
</nav>
<div class="wrap">
  <header><h1>Lexicon Master Suite</h1><div id="stats"></div></header>
  <div id="warn"></div>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script>
let KEY=null;
let S={words:[],days:[],skip:[]},storeOK=true;
let tab='study',editId=null,vq='',vtag='',card=null,lastId=null,ahead=false,confirmId=null,flipped=false;

function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.words))S=Object.assign({words:[],days:[],skip:[]},o)}}catch(e){storeOK=false}}
function save(){if(!KEY)return;S.u=Date.now();push();try{localStorage.setItem(KEY,JSON.stringify(S));storeOK=true}catch(e){storeOK=false}$('#warn').innerHTML=storeOK?'':'<div class="note">This browser isn’t saving data. Use Backup in the Vault tab to keep a copy of your words.</div>'}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey=d=>new Date(d).toLocaleDateString('en-CA');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function streak(){const set=new Set(S.days);const d=new Date();let n=0;if(!set.has(dayKey(d)))d.setDate(d.getDate()-1);while(set.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n}
function rel(t){const m=Math.round((t-Date.now())/6e4);if(m<=0)return'now';if(m<60)return'in '+m+' min';const h=Math.round(m/60);if(h<24)return'in '+h+' h';return'in '+Math.round(h/24)+' d'}
function tags(){const s=new Set();S.words.forEach(w=>w.tags.forEach(t=>s.add(t)));return[...s].sort()}
function due(){const n=Date.now();return S.words.filter(w=>w.due<=n).sort((a,b)=>a.due-b.due)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1600)}

function render(keep){
  document.querySelector('nav').style.display=(user&&!admin)?'':'none';
  if(!user||admin){$('#stats').innerHTML='';$('#main').innerHTML=admin?viewAdmin():viewLogin();if(!keep)window.scrollTo(0,0);return}
  $('#stats').innerHTML=`<span><b>${S.words.length}</b> words</span><span><b>${due().length}</b> due</span><span><b>${streak()}</b>-day streak</span><button class="chip" data-act="switch" style="min-height:30px;padding:2px 12px">Log out</button>${isAdmin?'<button class="chip" data-act="adm" style="min-height:30px;padding:2px 12px">Admin</button>':''}`;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
  $('#main').innerHTML=tab==='log'?viewLog():tab==='vault'?viewVault():tab==='disc'?viewDisc():viewStudy();
  if(!keep)window.scrollTo(0,0);
  const t=$('#ta');if(t)t.focus({preventScroll:true});
}

/* ---------- Log ---------- */
function viewLog(){
  const w=S.words.find(x=>x.id===editId)||{word:'',def:'',trig:'',tags:[]};
  return `<h2>${editId?'Edit word':'Log a word'}</h2><div class="panel">
  <label>Word<input id="fw" value="${esc(w.word)}" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
  <div class="row" style="margin:-6px 0 14px"><button class="btn ghost sm" id="lk" type="button" data-act="lookup">Look up definition</button><span class="mut" style="font-size:.82rem;align-self:center">Fills empty fields only</span></div>
  <label>Definition<textarea id="fd" rows="3">${esc(w.def)}</textarea></label>
  <label>Situational trigger <span class="mut">(a real moment where you’d use it)</span><textarea id="fs" rows="2">${esc(w.trig)}</textarea></label>
  <label>Example sentence <span class="mut">(use ___ where the word goes)</span><textarea id="fe" rows="2">${esc(w.sent)}</textarea></label>
  <div class="row"><label style="flex:1;min-width:140px">Synonym<input id="fy" value="${esc(w.syn)}" autocomplete="off" autocapitalize="off"></label><label style="flex:1;min-width:140px">Antonym<input id="fa" value="${esc(w.ant)}" autocomplete="off" autocapitalize="off"></label></div>
  <label>Root <span class="mut">(like bene=good)</span><input id="fr" value="${esc(w.root)}" autocomplete="off" autocapitalize="off"></label>
  <label>Tags <span class="mut">(separate with commas)</span><input id="ft" value="${esc(w.tags.join(', '))}" autocapitalize="off" autocomplete="off"></label>
  ${tags().length?`<div class="chips">${tags().map(t=>`<button class="chip" data-act="addtag" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div>`:''}
  <div class="row"><button class="btn" data-act="save">${editId?'Save changes':'Add word'}</button>${editId?'<button class="btn ghost" data-act="cancel">Cancel</button>':''}</div></div>`;
}
function saveWord(){
  const word=$('#fw').value.trim(),def=$('#fd').value.trim(),trig=$('#fs').value.trim(),sent=$('#fe').value.trim(),syn=$('#fy').value.trim(),ant=$('#fa').value.trim(),root=$('#fr').value.replace(/\s*=\s*/,'=').trim();
  const tg=[...new Set($('#ft').value.split(',').map(t=>t.trim().toLowerCase()).filter(Boolean))];
  if(!word||!def){toast('Add a word and a definition');return}
  if(sent&&!sent.includes('___')){toast('Put ___ where the word goes');return}
  const ex=S.words.find(x=>x.id===editId);
  if(ex){Object.assign(ex,{word,def,trig,sent,syn,ant,root,tags:tg})}
  else S.words.push({id:uid(),word,def,trig,sent,syn,ant,root,tags:tg,ease:2.5,int:0,reps:0,due:Date.now(),created:Date.now()});
  save();toast(ex?'Changes saved':'Word added');
  if(ex){editId=null;tab='vault'}
  render();
}

/* ---------- Vault ---------- */
function listHTML(){
  const q=vq.toLowerCase();
  const l=S.words.filter(w=>(!vtag||w.tags.includes(vtag))&&(!q||(w.word+' '+w.def+' '+w.trig).toLowerCase().includes(q))).sort((a,b)=>a.word.localeCompare(b.word));
  if(!l.length)return `<div class="empty mut">${S.words.length?'No words match.':'No words yet. Add your first one in the Log tab.'}</div>`;
  return l.map(w=>`<div class="item"><h3>${esc(w.word)}</h3><p>${esc(w.def)}</p>${w.trig?`<p class="trig">${esc(w.trig)}</p>`:''}
  <div class="meta">${w.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<span class="sp"></span><span class="mut" style="font-size:.8rem">due ${rel(w.due)}</span>
  <button class="btn ghost sm" data-act="edit" data-v="${w.id}">Edit</button>
  ${confirmId===w.id?`<button class="btn bad sm" data-act="del" data-v="${w.id}">Confirm delete</button>`:`<button class="btn ghost sm" data-act="del" data-v="${w.id}">Delete</button>`}</div></div>`).join('');
}
function viewVault(){
  return `<h2>Vault</h2><input id="vs" type="search" placeholder="Search words, definitions, triggers" value="${esc(vq)}" style="margin:0 0 12px">
  <div class="chips" id="vt">${chipsHTML()}</div><div id="list">${listHTML()}</div>
  <details><summary>Backup and restore</summary><div class="panel">
  <p class="mut" style="margin-top:0">Export creates a copy of all your words as text. Save it in Notes or email it to yourself. To restore, paste it here and choose Import.</p>
  <textarea id="bk" rows="5" placeholder="Backup text appears here" spellcheck="false"></textarea>
  <div class="row" style="margin-top:12px"><button class="btn sm" data-act="export">Export</button><button class="btn ghost sm" data-act="import">Import</button></div></div></details>`;
}
function chipsHTML(){return tags().length?`<button class="chip ${!vtag?'on':''}" data-act="ftag" data-v="">All</button>`+tags().map(t=>`<button class="chip ${vtag===t?'on':''}" data-act="ftag" data-v="${esc(t)}">${esc(t)}</button>`).join(''):''}

/* ---------- Study ---------- */
const shuf=a=>a.map(x=>[Math.random(),x]).sort((m,n)=>m[0]-n[0]).map(m=>m[1]);
let q=null,dtag='',foc={tag:'',ids:[]},picking=false;
const inFocus=w=>foc.ids.length?foc.ids.includes(w.id):(!foc.tag||w.tags.includes(foc.tag));
const cw=()=>S.words.find(x=>x.id===(card&&card.id));
function nextCard(){
  let pool=(foc.tag||foc.ids.length)?S.words.filter(inFocus).sort((a,b)=>a.due-b.due):due();
  if(!pool.length&&ahead)pool=S.words.slice().sort((a,b)=>a.ease-b.ease);
  let p=pool.filter(w=>w.id!==lastId);if(!p.length)p=pool;
  return p.length?{id:p[0].id}:null;
}
const first=x=>String(x||'').split(',')[0].trim();
const ROOTX=['water','new','self','carry','break','see','sleep','all','across','bad'];
function kinds(w){const k=[];if(w.sent&&w.sent.includes('___'))k.push('blank','usage');if(first(w.syn))k.push('syn');if(first(w.ant))k.push('ant');if((w.root||'').includes('='))k.push('root');return k}
function mkX(w,k){
  const all=[...S.words,...BANK],pool=[...new Set(all.map(x=>x.word))];
  const dis=(ex,n)=>shuf(pool.filter(x=>!ex.includes(x))).slice(0,n);
  const fill=x=>x.sent.split('___').join(w.word);
  let pr,ans,opts;
  if(k==='blank'){pr=`<div class="mut">Which word completes the sentence?</div><div class="scn">${esc(w.sent)}</div>`;ans=w.word;opts=[ans,...dis([ans],3)]}
  else if(k==='syn'||k==='ant'){
    ans=first(w[k]);
    const ex=[w.word,ans,...String(w.syn||'').split(',').map(x=>x.trim()),...String(w.ant||'').split(',').map(x=>x.trim())];
    pr=`<div class="mut">${k==='syn'?'Closest in meaning to':'Opposite in meaning to'}</div><div class="big">${esc(w.word)}</div>`;opts=[ans,...dis(ex,3)];
  }
  else if(k==='usage'){
    ans=fill(w);
    opts=[ans,...shuf(all.filter(x=>x.word!==w.word&&x.sent&&x.sent.includes('___'))).slice(0,2).map(fill)];
    pr=`<div class="mut">Which sentence uses “${esc(w.word)}” correctly?</div>`;
  }
  else{
    const r=w.root.split('=');ans=(r[1]||'').trim();
    const ms=[...new Set([...all.filter(x=>x.root&&x.root.includes('=')).map(x=>x.root.split('=')[1].trim()),...ROOTX])].filter(x=>x&&x!==ans);
    pr=`<div class="mut">“${esc(w.word)}” contains the root</div><div class="big">${esc(r[0].trim())}</div><div class="mut">What does it mean?</div>`;opts=[ans,...shuf(ms).slice(0,3)];
  }
  return{id:w.id,t:'x',k,pr,ans,opts:shuf(opts),done:false};
}
function mkQ(w){
  if(!w.seen)return{id:w.id,t:'intro'};
  const ks=kinds(w);
  if(ks.length&&Math.random()<.55)return mkX(w,ks[Math.floor(Math.random()*ks.length)]);
  const o=S.words.filter(x=>x.id!==w.id);
  const t=(w.reps>=3||o.length<2)?'type':'mc';
  const dirs=w.trig?['defword','trigword']:['defword'];
  if(t==='mc')dirs.push('worddef');
  const dir=dirs[Math.floor(Math.random()*dirs.length)];
  return{id:w.id,t,dir,opts:t==='mc'?shuf([w,...shuf(o).slice(0,3)]).map(x=>x.id):null,done:false};
}
function focusBar(){
  const on=foc.ids.length;
  return `<div class="chips"><button class="chip ${!foc.tag&&!on?'on':''}" data-act="ftg" data-v="">All words</button>${tags().map(t=>`<button class="chip ${foc.tag===t&&!on?'on':''}" data-act="ftg" data-v="${esc(t)}">${esc(t)}</button>`).join('')}<button class="chip ${on?'on':''}" data-act="fpick">${on?'Picked ('+on+')':'Pick words'}</button></div>`;
}
function viewPick(){
  return `<h2>Pick words to study</h2><p class="mut" style="margin-top:0">Tick the words you want in this session.</p>${S.words.slice().sort((a,b)=>a.word.localeCompare(b.word)).map(w=>`<label class="pk"><input type="checkbox" data-v="${w.id}"${foc.ids.includes(w.id)?' checked':''}><span><b>${esc(w.word)}</b> <span class="mut">${esc(w.def)}</span></span></label>`).join('')}<div class="row" style="margin-top:16px"><button class="btn" data-act="pgo">Study these</button><button class="btn ghost" data-act="pclr">Clear ticks</button></div>`;
}
function viewStudy(){if(picking)return viewPick();return (S.words.length?focusBar():'')+viewStudyInner()}
function viewStudyInner(){
  if(!S.words.length)return `<div class="panel empty"><h2>Nothing to study yet</h2><p class="mut">Log a few words, or add some from Discover.</p><button class="btn" data-act="tab" data-v="disc">Discover words</button></div>`;
  if(!card||!cw()){card=nextCard();q=null}
  if(!card){
    const nx=Math.min(...S.words.map(w=>w.due));
    return `<div class="panel empty"><h2>All caught up</h2><p class="mut">Next word is due ${rel(nx)}.</p><button class="btn ghost" data-act="ahead">Study ahead anyway</button></div>`;
  }
  const w=cw();
  if(!q||q.id!==w.id)q=mkQ(w);
  if(q.t==='intro')return `<div class="panel qc"><div class="mut">New word</div><div class="big">${esc(w.word)}</div><p class="scn">${esc(w.def)}</p>${w.trig?`<p class="trig">${esc(w.trig)}</p>`:''}${w.root?`<p class="mut">Root: ${esc(w.root.replace('=',' = '))}</p>`:''}</div><button class="btn" data-act="seen" style="width:100%">Got it, quiz me</button>`;
  let pr,body='';
  if(q.t==='x'){
    pr=q.pr;
    body=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt${q.done?(o===q.ans?' ok':i===q.pick?' bad':''):''}" data-act="xpick" data-v="${i}"${q.done?' disabled':''}><b>${i+1}</b>${esc(o)}</button>`).join('')}</div>`;
  }else{
    pr=q.dir==='worddef'?`<div class="mut">What does this mean?</div><div class="big">${esc(w.word)}</div>`
      :`<div class="mut">${q.dir==='trigword'?'Which word fits this moment?':'Which word matches this definition?'}</div><div class="scn">${esc(q.dir==='trigword'?w.trig:w.def)}</div>`;
    if(q.t==='mc')body=`<div class="opts">${q.opts.map((id,i)=>{const x=S.words.find(y=>y.id===id);const c=q.done?(id===w.id?' ok':id===q.pick?' bad':''):'';return `<button class="opt${c}" data-act="pick" data-v="${id}"${q.done?' disabled':''}><b>${i+1}</b>${esc(q.dir==='worddef'?x.def:x.word)}</button>`}).join('')}</div>`;
    else if(!q.done)body=`<input id="ta" placeholder="Type the word" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"><div class="row" style="margin-top:12px"><button class="btn" data-act="check">Check</button><button class="btn ghost" data-act="idk">I don’t know</button></div>`;
  }
  const al=q.t==='x'?q.ans:w.word;
  const fb=q.done?`<div class="panel fb ${q.ok?'okp':'badp'}"><b>${q.ok?'Correct':'Not quite'}</b>${q.ok?'':` <span>The ${q.t==='x'?'answer':'word'} is <b>${esc(al)}</b>.</span>`}<p>${esc(w.def)}</p>${w.trig?`<p class="trig">${esc(w.trig)}</p>`:''}<button class="btn" data-act="next" style="width:100%">Next word</button></div>`:'';
  return `<div class="panel qc">${pr}</div>${body}${fb}`;
}
function applyGrade(w,g){
  const now=Date.now();
  if(g<3){w.reps=0;w.int=0;w.due=now+6e4*(g===1?1:5)}
  else{
    w.reps++;
    w.int=w.reps===1?1:w.reps===2?(g>=4?4:2):Math.max(w.int+1,Math.round(w.int*w.ease*(g===3?.85:g===5?1.15:1)));
    w.due=now+w.int*864e5;
  }
  w.ease=Math.max(1.3,w.ease+(.1-(5-g)*(.08+(5-g)*.02)));
  const k=dayKey(now);if(!S.days.includes(k))S.days.push(k);
  save();
}
function answer(w,ok,g){q.done=true;q.ok=ok;applyGrade(w,g);render(1)}
function check(skip){
  const w=cw();if(!w||q.done)return;
  const v=(($('#ta')||{}).value||'').trim().toLowerCase();
  if(!skip&&!v){toast('Type your answer first');return}
  const ok=!skip&&v===w.word.trim().toLowerCase();
  answer(w,ok,ok?5:1);
}

async function lookup(){
  const w=$('#fw').value.trim().toLowerCase();if(!w){toast('Type a word first');return}
  const b=$('#lk');b.disabled=true;b.textContent='Looking up…';
  try{
    const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w));
    if(!r.ok)throw 0;
    const m=(await r.json())[0].meanings||[],ds=m.flatMap(x=>x.definitions||[]);
    const set=(id,v)=>{const e=$(id);if(v&&e&&!e.value.trim())e.value=v};
    set('#fd',ds[0]&&ds[0].definition);
    const ex=(ds.find(x=>x.example)||{}).example||'',i=ex.toLowerCase().indexOf(w);
    if(i>=0)set('#fe',ex.slice(0,i)+'___'+ex.slice(i+w.length));
    set('#fy',m.flatMap(x=>[...(x.synonyms||[]),...(x.definitions||[]).flatMap(y=>y.synonyms||[])])[0]);
    set('#fa',m.flatMap(x=>[...(x.antonyms||[]),...(x.definitions||[]).flatMap(y=>y.antonyms||[])])[0]);
    toast('Filled in what I found');
  }catch(e){toast('No result (lookup works once hosted)')}
  b.disabled=false;b.textContent='Look up definition';
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='tab'){tab=v;picking=false;if(v!=='log')editId=null;confirmId=null;render()}
  else if(a==='save')saveWord();
  else if(a==='cancel'){editId=null;tab='vault';render()}
  else if(a==='addtag'){const i=$('#ft'),cur=i.value.split(',').map(t=>t.trim()).filter(Boolean);if(!cur.includes(v))cur.push(v);i.value=cur.join(', ')}
  else if(a==='ftag'){vtag=v;$('#vt').innerHTML=chipsHTML();$('#list').innerHTML=listHTML()}
  else if(a==='edit'){editId=v;tab='log';render()}
  else if(a==='del'){
    if(confirmId===v){S.words=S.words.filter(w=>w.id!==v);confirmId=null;save();toast('Word deleted');render()}
    else{confirmId=v;$('#list').innerHTML=listHTML()}
  }
  else if(a==='seen'){const w=cw();if(w){w.seen=true;q=null;save();render()}}
  else if(a==='pick'){if(q&&!q.done){const w=cw();q.pick=v;answer(w,v===w.id,v===w.id?4:1)}}
  else if(a==='check'||a==='idk')check(a==='idk');
  else if(a==='next')next();
  else if(a==='dtag'){dtag=v;render(1)}
  else if(a==='xpick'){if(q&&!q.done){const w=cw();q.pick=+v;const ok=q.opts[+v]===q.ans;answer(w,ok,ok?4:1)}}
  else if(a==='lookup')lookup();
  else if(a==='mode'){mode=mode==='up'?'in':'up';render()}
  else if(a==='li')auth('login');
  else if(a==='su')auth('signup');
  else if(a==='switch')logOut();
  else if(a==='adm')openAdmin();
  else if(a==='aback'){admin=false;confirmU='';aData='';render()}
  else if(a==='aview'){api('/api/admin?id='+encodeURIComponent(v)).then(j=>{aData=JSON.stringify(j.data);render(1)}).catch(e=>toast(e.message))}
  else if(a==='adel'){if(confirmU===v){confirmU='';api('/api/admin?id='+encodeURIComponent(v),{method:'DELETE'}).then(()=>openAdmin()).catch(e=>toast(e.message))}else{confirmU=v;render(1)}}
  else if(a==='ftg'){foc={tag:v,ids:[]};card=null;q=null;render()}
  else if(a==='fpick'){picking=true;render()}
  else if(a==='pclr')document.querySelectorAll('.pk input').forEach(i=>i.checked=false);
  else if(a==='pgo'){const ids=[...document.querySelectorAll('.pk input:checked')].map(i=>i.dataset.v);if(!ids.length){toast('Tick at least one word');return}foc={tag:'',ids};picking=false;card=null;q=null;render()}
  else if(a==='dskip'){S.skip.push(v);save();render(1)}
  else if(a==='dunskip'){S.skip=[];save();render(1)}
  else if(a==='dadd'){const b=BANK.find(x=>x.word===v);if(b){S.words.push({id:uid(),word:b.word,def:b.def,trig:b.trig,sent:b.sent,syn:b.syn,ant:b.ant,root:b.root,tags:[b.tag],ease:2.5,int:0,reps:0,due:Date.now(),created:Date.now()});save();toast('Added to your words');render(1)}}
  else if(a==='ahead'){ahead=true;card=null;render()}
  else if(a==='export'){
    const t=$('#bk');t.value=JSON.stringify(S);t.focus();t.select();
    try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),()=>toast('Select and copy the text'))}catch(x){toast('Select and copy the text')}
  }
  else if(a==='import'){
    try{
      const o=JSON.parse($('#bk').value);if(!o||!Array.isArray(o.words))throw 0;
      const have=new Set(S.words.map(w=>w.id)),hw=new Set(S.words.map(w=>w.word.toLowerCase()));let n=0;

      (o.days||[]).forEach(d=>{if(!S.days.includes(d))S.days.push(d)});
      save();toast(n+' words imported');render();
    }catch(x){toast('That backup text isn’t valid')}
  }
});

  if(!user||tab!=='study'||!q)return;
  if(e.target.id==='ta'){if(e.key==='Enter'){e.preventDefault();check(false)}return}
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  const c=x=>{const b=document.querySelector(x);if(b)b.click()};
  if(e.key==='Enter'){e.preventDefault();c(q.done?'[data-act=next]':'[data-act=seen]')}
  else if((q.t==='mc'||q.t==='x')&&!q.done&&e.key>='1'&&e.key<='4')c('.opt:nth-child('+e.key+')');
});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
